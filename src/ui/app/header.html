<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-security-policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval'" />
        <title>Pickle Glass Header</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: transparent;
            }

            html.content-protection-disabled::after {
                content: '';
                position: fixed;
                inset: 0;
                z-index: 2147483647;
                border: 2px solid #ff3b30;
                border-radius: 12px;
                box-sizing: border-box;
                pointer-events: none;
            }

            html.content-protection-disabled.main-header-active::after {
                bottom: auto;
                height: 47px;
                border-radius: 9999px;
            }

            html.content-protection-disabled.main-header-active::before {
                content: 'Невидимость отключена';
                position: fixed;
                top: 50px;
                left: 0;
                right: 0;
                z-index: 2147483647;
                color: #ff3b30;
                font: 600 12px/16px 'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                text-align: center;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <div id="header-container" tabindex="0" style="outline: none;">
        </div>

        <script type="module" src="../../../public/build/header.js"></script>
        <script>
            const params = new URLSearchParams(window.location.search);
            if (params.get('glass') === 'true') {
                document.body.classList.add('has-glass');
            }
        </script>
    </body>
</html>
